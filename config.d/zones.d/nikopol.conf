# slacoin@nuxeo.com gnupg keyring (https://github.com/nxmatic/keyhole.git)

Host rdp.nikopol
   HostName nikopol.local

# vz-host.nikopol retired: the bare-metal Mac hosting nikopol is on
# a corp-managed network where neither bbox-served `.lan` resolution
# nor mDNS multicast reach.  See catalog/default.nix tailnet.hosts
# header for the full retirement note.

Host *.nikopol
   User nxmatic
   IdentityFile ~/.local/var/run/secrets/ssh-keys/rdp-host

Host nixos.nikopol
   HostName nikopol-nixos.local
   
Include ~/.ssh/config.d/zones.d/nikopol.d/*.conf
