# The HOST recipients below are age identities DERIVED from an ed25519 SSH key via `ssh-to-age`, so
# the SSH key is the single source of truth for those.  Recompute such a line with
# `ssh-to-age < <key>.pub` (the host public keys live in /etc/ssh/ssh_host_ed25519_key.pub).
#
# ★ The OPERATOR recipient is deliberately NOT derived from anything: the key that opens a file
# must not live inside that file, and the original operator key was an entry of the very keys.yaml
# it decrypts — which is why one leak opened every sops file in both repositories.  For the same
# reason no key of keys.yaml is a recipient here.
#
#   age1hlvu…   operator (sops only)    — ★ STANDALONE, generated on its own, present in no
#                                         keys.yaml. Lives only at ~/.config/sops/age/, which
#                                         activation reads as an import candidate and never
#                                         rewrites.
#   age1trxp…   bioskop host key        — the DARWIN host.
#   age17q5k…   nikopol host key        — the DARWIN guest.
#   age1fe9g…   the NixOS guests, interim — generated on nikopol-nixos, held by BOTH guests today
#                                         (/var/lib/sops-nix/<guest>.age). Recipient of the three
#                                         files the guests declare, and of nothing else. It goes
#                                         once each access point decrypts with its own (S4).
#   age1avmc…   the bioskop access point — `ssh-to-age` of host-bioskop's recorded PUBLIC (the
#                                         operator seat's host key, roles × keys): the identity
#                                         ndh-identity-push places in bioskop-nixos. Added beside
#                                         age1fe9g… first, so the push lands on files it already
#                                         opens (S4, first half).
#
# ⚠️ The narrow rule below narrows LESS than it looks:
# keys.yaml is decrypted whole by every host, so the guest still opens every SSH private.
# What it buys is that nothing travels — the real narrowing is one sops file per consumer.
#
# ⛔ Former recipients, removed on 2026-10-10, whose privates were PUBLISHED or exposed: every
# version of a file encrypted to one of them before that date is readable by whoever holds that
# private, and re-encrypting does not change that.
#   age19fvdj…  operator, printed into a session log on 2026-10-05.
#   age10ey0l…  github-signing-hyland@26-05-29, in the clear in rke2lab from 2026-08-27.
#   age1k0tc4…  rke2-cluster@26-05-29, in the 52 store copies pushed to the public cache.
#   age1stxd…   operator, exposed in a session transcript on 2026-10-10 (not published).
#
# ⛔ The corp-managed vz host holds NO age identity and is no recipient.  The one thing it read
# `.secrets` for — the Tailscale OAuth client, to free a guest's tailnet name before a factory reset —
# is done from a fabric host instead (`manage-tailnet --reclaim-host <guest> --apply`, then the reset
# with NDH_TAILNET_RECLAIM=skip); the materializer's error says so.
#
# Rules match top-down, so the narrow ones come first.  Each keeps the settings its files were
# encrypted with: the two YAML files mark values by comment, `.secrets` does not.
creation_rules:
  - path_regex: '(^|/)(catalog/cache-trust\.yaml|modules/home-manager/ssh\.d/keys\.yaml)$'
    encrypted_comment_regex: 'sops:encrypted'
    age:
      - 'age1hlvu7l7kefeum8drzvc5jp0jhgsqw2h3t3a8rmzvx05lcrsmx48q2ehxsk'
      - 'age1trxpn8efl5jctwakgpxxjd2h6x5h2m40ggugxl909qsj0h99p9yqkk8tej'
      - 'age17q5kw0epcl9ft7ecegr20040vx3g86z0f7vtecn9t8kk27qjspaqp66pp4'
      - 'age1fe9gs0mljq82cwxasugyrjd4pqg9h4uym5r3rwfc2084q558hd7qt4845j'
      - 'age1avmcejlekelhkm02v3algs9z37fsp27658zpjagkr5w7uxhqguesdmmz0m'
  - path_regex: '(^|/)\.secrets$'
    age:
      - 'age1hlvu7l7kefeum8drzvc5jp0jhgsqw2h3t3a8rmzvx05lcrsmx48q2ehxsk'
      - 'age1trxpn8efl5jctwakgpxxjd2h6x5h2m40ggugxl909qsj0h99p9yqkk8tej'
      - 'age17q5kw0epcl9ft7ecegr20040vx3g86z0f7vtecn9t8kk27qjspaqp66pp4'
      - 'age1fe9gs0mljq82cwxasugyrjd4pqg9h4uym5r3rwfc2084q558hd7qt4845j'
      - 'age1avmcejlekelhkm02v3algs9z37fsp27658zpjagkr5w7uxhqguesdmmz0m'
  # Text formats keep the encrypted comment regex for inline markers.
  - path_regex: '.*\.(ya?ml|json|env|ini|toml|cert)$'
    encrypted_comment_regex: 'sops:encrypted'
    age:
      - 'age1hlvu7l7kefeum8drzvc5jp0jhgsqw2h3t3a8rmzvx05lcrsmx48q2ehxsk'
      - 'age1trxpn8efl5jctwakgpxxjd2h6x5h2m40ggugxl909qsj0h99p9yqkk8tej'
      - 'age17q5kw0epcl9ft7ecegr20040vx3g86z0f7vtecn9t8kk27qjspaqp66pp4'
  # Binary/other files skip comment regex to avoid the warning.
  - path_regex: '.*'
    age:
      - 'age1hlvu7l7kefeum8drzvc5jp0jhgsqw2h3t3a8rmzvx05lcrsmx48q2ehxsk'
      - 'age1trxpn8efl5jctwakgpxxjd2h6x5h2m40ggugxl909qsj0h99p9yqkk8tej'
      - 'age17q5kw0epcl9ft7ecegr20040vx3g86z0f7vtecn9t8kk27qjspaqp66pp4'
stores:
  json:
    indent: 2
  json_binary:
    indent: 2
  yaml:
    indent: 2
