# Every recipient below is an age identity DERIVED from an ed25519 SSH key via `ssh-to-age`, so the
# SSH key is the single source of truth and no age key is ever generated on its own.  Recompute any
# line with `ssh-to-age < <key>.pub` (the public keys live in ~/.local/share/ndh/ssh-keys/, the host
# ones in /etc/ssh/ssh_host_ed25519_key.pub).
#
#   age10ey0l…  github-signing-hyland   — ★ the SAME ed25519 key signs commits and decrypts this
#                                         repo AND rke2lab, so the two lifecycles are COUPLED:
#                                         rotating the GitHub signing key silently revokes operator
#                                         decryption everywhere. Re-key both repos in that change.
#   age1trxp…   bioskop host key        — lets sops-nix decrypt on bioskop at activation
#   age17q5k…   nikopol host key        — likewise on nikopol
#   age1k0tc4…  rke2-cluster            — ALSO a recipient in rke2lab, which is what lets both the
#                                         operator and in-cluster Flux decrypt the same content
#
# ★ The operator key is what a corp-managed vz-host decrypts `.secrets` with — the Tart materializer
# carries the ENCRYPTED blob in its own bundle (it has no ndh checkout) and reads it there.  No extra
# recipient was added for that machine, DELIBERATELY: the operator key is ALREADY on it to sign
# commits, so scoping sops to some other identity would change nothing about what is readable there
# — the private key sits in that home either way.  The exposure to name is therefore this list, not
# the machine: `age10ey0l…` opens EVERY file here, including
# modules/home-manager/ssh.d/keys.yaml and the `mammoth-skate` SSH authority's private material.
# Narrowing THAT is the real fix (a distinct operator identity for the sensitive files) and it is not
# done. Until then, a narrower door exists for this one use:
# `manage-tailnet --client-secret-file` takes the Tailscale OAuth client alone, with no age key.
creation_rules:
  # Text formats keep the encrypted comment regex for inline markers.
  - path_regex: '.*\.(ya?ml|json|env|ini|toml|cert)$'
    encrypted_comment_regex: 'sops:encrypted'
    age:
      - 'age10ey0lcup4zpjqcknpxw7enpsagn674nm634f2u75trfr5t62uq5qdjuxzv'
      - 'age1trxpn8efl5jctwakgpxxjd2h6x5h2m40ggugxl909qsj0h99p9yqkk8tej'
      - 'age17q5kw0epcl9ft7ecegr20040vx3g86z0f7vtecn9t8kk27qjspaqp66pp4'
      - 'age1k0tc4gmaqrk5df3ujja34gkqxstu0cye7fl7fktjeuua3yych3aqxfjlak'
  # Binary/other files skip comment regex to avoid the warning.
  - path_regex: '.*'
    age:
      - 'age10ey0lcup4zpjqcknpxw7enpsagn674nm634f2u75trfr5t62uq5qdjuxzv'
      - 'age1trxpn8efl5jctwakgpxxjd2h6x5h2m40ggugxl909qsj0h99p9yqkk8tej'
      - 'age17q5kw0epcl9ft7ecegr20040vx3g86z0f7vtecn9t8kk27qjspaqp66pp4'
      - 'age1k0tc4gmaqrk5df3ujja34gkqxstu0cye7fl7fktjeuua3yych3aqxfjlak'
stores:
  json:
    indent: 2
  json_binary:
    indent: 2
  yaml:
    indent: 2
