version = 1
[install.git]
pkg-path = "git"

[install.git-town]
pkg-path = "git-town"

[install.gitflow]
pkg-path = "gitflow"

[install.home-manager]
pkg-path = "home-manager"

[install.keychain]
pkg-path = "keychain"

[install.linux-builder]
pkg-path = "darwin.linux-builder"
systems = ["aarch64-darwin", "x86_64-darwin"]

[install.lldpd]
pkg-path = "lldpd"

[install.nix-tree]
pkg-path = "nix-tree"

[install.nixd]
pkg-path = "nixd"

[install.nixtract]
pkg-path = "nixtract"

[install.nvfetcher]
pkg-path = "nvfetcher"

[install.ookla-speedtest]
pkg-path = "ookla-speedtest"

[install.pass]
pkg-path = "pass"

[install.pstree]
pkg-path = "pstree"

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-darwin", "x86_64-linux"]

[profile]
common = """# Flox profile fragment shared across hosts
flox_env_local="${FLOX_ENV_PROJECT}/.local"

mkdir -p \
  "${flox_env_local}/.config" \
  "${flox_env_local}/.cache" \
  "${flox_env_local}/.local/share" \
  "${flox_env_local}/.local/state" \
  "${flox_env_local}/.local/xdg"

export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-${flox_env_local}/.config}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-${flox_env_local}/.cache}"
export XDG_DATA_HOME="${XDG_DATA_HOME:-${flox_env_local}/.local/share}"
export XDG_STATE_HOME="${XDG_STATE_HOME:-${flox_env_local}/.local/state}"
export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-${flox_env_local}/.local/xdg}"

if [ -d "${FLOX_ENV_PROJECT}/.github" ] && command -v gh >/dev/null 2>&1; then
  gh_login=""
  if [ -n "${GH_TOKEN:-}" ]; then
    gh_login=$(gh api user --jq '.login' 2>/dev/null || true)
  elif command -v pass >/dev/null 2>&1; then
    gh_secret=$(pass show coding/github@work 2>/dev/null | head -n 1 || true)
    if [ -n "${gh_secret}" ]; then
      gh_login=$(env GH_TOKEN="${gh_secret}" gh api user --jq '.login' 2>/dev/null || true)
    fi
  fi

  if [ -n "${gh_login}" ]; then
    remote=$(git -C "${FLOX_ENV_PROJECT}" remote get-url origin 2>/dev/null || true)
    if [ -n "${remote}" ]; then
      owner=$(printf '%s' "${remote}" | cut -d'/' -f 4)
      repo_name=$(printf '%s' "${remote}" | cut -d'/' -f 5 | cut -d'.' -f 1)
      export GITHUB_LOGIN="${gh_login}"
      export GITHUB_OWNER="${owner}"
      export GITHUB_REPOSITORY="${owner}/${repo_name}"
    fi
  fi
fi

mvnw_path="${FLOX_ENV_PROJECT}/mvnw"
if [ -x "${mvnw_path}" ]; then
  maven_user_config="${FLOX_ENV_PROJECT}/.m2"
  mkdir -p "${maven_user_config}"
  export MAVEN_USER_CONFIG="${maven_user_config}"
  export MAVEN_SETTINGS="${MAVEN_USER_CONFIG}/settings.xml"

  if [ -n "${MAVEN_ARGS:-}" ]; then
    case " ${MAVEN_ARGS} " in
      *"--settings="*) ;;
      *) export MAVEN_ARGS="${MAVEN_ARGS} --settings=${MAVEN_SETTINGS}" ;;
    esac
  else
    export MAVEN_ARGS="--settings=${MAVEN_SETTINGS}"
  fi

  if [ -d "${FLOX_ENV_PROJECT}/.mvnrepository" ]; then
    export MAVEN_LOCAL_REPOSITORY="${FLOX_ENV_PROJECT}/.mvnrepository"
  elif [ -d "${FLOX_ENV_PROJECT}/.m2/repo" ]; then
    export MAVEN_LOCAL_REPOSITORY="${FLOX_ENV_PROJECT}/.m2/repo"
  fi

  maven_version_output=$("${mvnw_path}" -N -q -DmavenVersion=3.9.9 \
    -Dexpression=maven.version -Doutput=/dev/stdout help:evaluate 2>/dev/null | grep -v '^\[.*\]' | tail -n 1)
  if [ -n "${maven_version_output}" ]; then
    export MAVEN_VERSION="${maven_version_output}"
  fi
fi
"""
