    "profile": {
      "common": "flox_env_local=\"${FLOX_ENV_PROJECT}/.local\"\n\nmkdir -p \\\n  \"${flox_env_local}/.config\" \\\n  \"${flox_env_local}/.cache\" \\\n  \"${flox_env_local}/.local/share\" \\\n  \"${flox_env_local}/.local/state\" \\\n  \"${flox_env_local}/.local/xdg\"\n\nexport XDG_CONFIG_HOME=\"${XDG_CONFIG_HOME:-${flox_env_local}/.config}\"\nexport XDG_CACHE_HOME=\"${XDG_CACHE_HOME:-${flox_env_local}/.cache}\"\nexport XDG_DATA_HOME=\"${XDG_DATA_HOME:-${flox_env_local}/.local/share}\"\nexport XDG_STATE_HOME=\"${XDG_STATE_HOME:-${flox_env_local}/.local/state}\"\nexport XDG_RUNTIME_DIR=\"${XDG_RUNTIME_DIR:-${flox_env_local}/.local/xdg}\"\n\nif [ -d \"${FLOX_ENV_PROJECT}/.github\" ] && command -v gh >/dev/null 2>&1; then\n  gh_login=\"\"\n  if [ -n \"${GH_TOKEN:-}\" ]; then\n    gh_login=$(gh api user --jq '.login' 2>/dev/null || true)\n  elif command -v pass >/dev/null 2>&1; then\n    gh_secret=$(pass show coding/github@work 2>/dev/null | head -n1 || true)\n    if [ -n \"${gh_secret}\" ]; then\n      gh_login=$(env GH_TOKEN=\"${gh_secret}\" gh api user --jq '.login' 2>/dev/null || true)\n    fi\n  fi\n\n  if [ -n \"${gh_login}\" ]; then\n    remote=$(git -C \"${FLOX_ENV_PROJECT}\" remote get-url origin 2>/dev/null || true)\n    if [ -n \"${remote}\" ]; then\n      owner=$(printf '%s' \"${remote}\" | cut -d'/' -f4)\n      repo_name=$(printf '%s' \"${remote}\" | cut -d'/' -f5 | cut -d'.' -f1)\n      export GITHUB_LOGIN=\"${gh_login}\"\n      export GITHUB_OWNER=\"${owner}\"\n      export GITHUB_REPOSITORY=\"${owner}/${repo_name}\"\n    fi\n  fi\nfi\n\nmvnw_path=\"${FLOX_ENV_PROJECT}/mvnw\"\nif [ -x \"${mvnw_path}\" ]; then\n  maven_user_config=\"${FLOX_ENV_PROJECT}/.m2\"\n  mkdir -p \"${maven_user_config}\"\n  export MAVEN_USER_CONFIG=\"${maven_user_config}\"\n  export MAVEN_SETTINGS=\"${MAVEN_USER_CONFIG}/settings.xml\"\n\n  if [ -n \"${MAVEN_ARGS:-}\" ]; then\n    case \" ${MAVEN_ARGS} \" in\n      *\"--settings=\"*) ;;\n      *) export MAVEN_ARGS=\"${MAVEN_ARGS} --settings=${MAVEN_SETTINGS}\" ;;\n    esac\n  else\n    export MAVEN_ARGS=\"--settings=${MAVEN_SETTINGS}\"\n  fi\n\n  if [ -d \"${FLOX_ENV_PROJECT}/.mvnrepository\" ]; then\n    export MAVEN_LOCAL_REPOSITORY=\"${FLOX_ENV_PROJECT}/.mvnrepository\"\n  elif [ -d \"${FLOX_ENV_PROJECT}/.m2/repo\" ]; then\n    export MAVEN_LOCAL_REPOSITORY=\"${FLOX_ENV_PROJECT}/.m2/repo\"\n  fi\n\n  maven_version_output=$(\"${mvnw_path}\" -N -q -DmavenVersion=3.9.9 \\\n    -Dexpression=maven.version -Doutput=/dev/stdout help:evaluate 2>/dev/null | grep -v '^\\[.*\\]' | tail -n1)\n  if [ -n \"${maven_version_output}\" ]; then\n    export MAVEN_VERSION=\"${maven_version_output}\"\n  fi\nfi\n"
    },
