## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
environments = [
 { dir = "./.flox-envs.d/nix" },
 { dir = "./.flox-envs.d/shell" },
 { dir = "./.flox-envs.d/tart" }
]


