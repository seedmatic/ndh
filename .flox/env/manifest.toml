schema-version = "1.10.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
remake.pkg-path = "remake"
speedtest-go.pkg-path = "speedtest-go"
dasel.pkg-path = "dasel"
lsof.pkg-path = "lsof"
nixos-rebuild-ng.pkg-path = "nixos-rebuild-ng"
vector.pkg-path = "vector"
grpcurl.pkg-path = "grpcurl"
# x509 toolkit used by the SSH enrichment pipeline to mint TLS leaf
# certs off OpenSSH Ed25519 CA keys (see
# modules/.common.d/ssh-keys.d/ssh-enrich-keys-yaml.sh's
# sign::tls_server) and by the bin/authority-bootstrap-tls-root.sh
# ceremony to mint the CA root itself.  Mirrors the `step-cli` entry
# added to modules/.common.d/system-packages.nix so that both the dev
# shell and the deployed host systems share the same signer.
step-cli.pkg-path = "step-cli"
ngrok.pkg-path = "ngrok"
# manage-tailnet: administer the Tailscale tailnet (rotate per-kind auth keys,
# sync-acl, retag + prune stale devices; dry-run by default, --apply to write). A
# repo-LOCAL flake package, so a path: flakeref reflecting the working copy (not a
# lagging remote ref) — resolve from the repo root (where .flox lives) on activate.
# systems: the flake exposes it for aarch64-darwin only (the admin runs it from the
# Mac); without this, flox tries to lock it for every default system (x86_64-darwin …)
# and fails since the flake provides no such attribute.
manage-tailnet.flake = "path:.#manage-tailnet"
manage-tailnet.systems = ["aarch64-darwin"]
# incus-client: the Incus CLI, for driving the fleet's daemons from this shell — the two-member
# cluster, and the remote-trust reconciliation in modules/darwin/incus-remote-trust.nix. ndh owns the
# package (the daemon's NixOS modules live here), and rke2lab re-exports it for its own env.
#
# `path:.` for the same reason manage-tailnet uses it above: a repo-LOCAL package, so the flakeref
# tracks the working copy instead of a remote ref that lags behind it.
#
# systems: BOTH, unlike manage-tailnet — the client is wanted on the Mac that drives the cluster and
# inside the Linux guests. It must still be listed, because the flake exposes nothing for flox's other
# default systems (x86_64-*) and locking would fail on the missing attribute.
incus-client.flake = "path:.#incus-client"
incus-client.systems = [
  "aarch64-darwin",
  "aarch64-linux",
]
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
## The flake-input registry indirection. This repo's seedmatic inputs are INDIRECT ids
## (`url = "flake-commons"`), resolved through nix's registry instead of naming a branch
## in flake.nix — so re-aiming one is a LOCAL edit, never a flake edit that has to be
## pushed before the rest of the chain can see it.
##
## `flake-registry.json` is COMMITTED and carries the default, branch-less targets. It has
## to be committed because of `relock`: it CLONES the repo to re-lock it (rke2lab's
## nix/relock.sh), so a registry that existed only as a gitignored file would leave it
## unable to resolve a single seedmatic input — and its `relock_input` only PRINTS
## "FAILED to resolve" while still exiting 0, which is the silent-ish failure this whole
## indirection exists to abolish.
##
## A gitignored `flake-registry.local.json` REPLACES it wholesale when present. Not
## merged on purpose: a merge needs jq, which this env does not install, and a stale local
## copy missing a newly added id fails LOUDLY (`cannot find flake 'flake:x' in the flake
## registries`) rather than resolving the wrong thing. Copy the committed file and edit the
## lines you want — e.g. aim `flake-commons` at `git+file:///…/nix-flake-commons.d/develop`
## to build your own commits WITHOUT pushing them.
##
## It takes the GLOBAL registry slot, measured to cost nothing here: `nixpkgs` keeps
## resolving through the SYSTEM registry (higher precedence, pinned by nix-darwin) and
## nothing in this closure ever relied on a channels.nixos.org indirect id.
on-activate = '''
  _ndh_registry="$FLOX_ENV_PROJECT/flake-registry.json"
  if [ -f "$FLOX_ENV_PROJECT/flake-registry.local.json" ]; then
    _ndh_registry="$FLOX_ENV_PROJECT/flake-registry.local.json"
  fi
  # nix.conf settings are newline-separated, and NIX_CONFIG may already carry some.
  _ndh_nl='
'
  export NIX_CONFIG="${NIX_CONFIG:+${NIX_CONFIG}${_ndh_nl}}flake-registry = $_ndh_registry"
  unset _ndh_registry _ndh_nl
'''


