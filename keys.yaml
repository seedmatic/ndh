# SSH keys bundle — v2 schema.
# Authorities are hoisted; each key references its signing CA by name
# via `authority:` and declares the cert types the authority signs
# for it via `cert_usage:`. Keys filter into per-profile splits via
# the `profiles: [bringup|host|user]` list.
#
# Validated by modules/home-manager/ssh.d/keys.schema.yaml.
# Consumed by modules/.common.d/ssh-keys.d/ssh-enrich-keys-yaml.sh.
authorities:
  mammoth-skate:
    type: ssh-ed25519
    comment: cert-authority@mammoth-skate
    domain: mammoth-skate.ts.net
    public: AAAAC3NzaC1lZDI1NTE5AAAAIMm2fu/uVbaaj1OljiSnZ9T1ES9yvbG+Y6JhyLrnQQAS
    # sops:encrypted
    private: ENC[AES256_GCM,data:,iv:WJAg3ySzge94GEo7dx5jL+zpxCyAD35qqD7wqsdjric=,tag:62VbsVvErOYCeVadl4pjEg==,type:str]
    usage:
      - ssh-authority
    annotations:
      public_scope: system
keys:
  nix-store:
    type: ssh-ed25519
    authority: mammoth-skate
    # v1: authorities.mammoth-skate.usage = [ssh-user]
    cert_usage:
      - ssh-user
    comment: nix-store@mammoth-skate
    usage:
      - ssh-host
      - user-signing
    profiles:
      - bringup
      - system
    principals:
      nix-store: nix-store
    annotations:
      public_scope: system
  linux-builder:
    type: ssh-ed25519
    authority: mammoth-skate
    # v1: authorities.mammoth-skate.usage = [ssh-host, ssh-user]
    cert_usage:
      - ssh-host
      - ssh-user
    comment: linux-builder@mammoth-skate
    usage:
      - ssh-host
      - agent-signing
      - user-signing
    profiles:
      - system
      - user
    principals:
      linux-builder: linux-builder
      committed: committed
    public: AAAAC3NzaC1lZDI1NTE5AAAAIMHU43EVt2ETrAd7u65ZX+nyLtbMKVr+zvdyM/6db7MV
    # sops:encrypted
    private: ENC[AES256_GCM,data:,iv:5L2WAZNSVBhh+Wfw1dra+2rro3ccQlvNtF7nB/I6Imw=,tag:53dcPvZemTMMBARoqURf3w==,type:str]
    annotations:
      public_scope: user
  rdp-host:
    type: ssh-ed25519
    authority: mammoth-skate
    # v1: authorities.mammoth-skate.usage = [ssh-host, ssh-user]
    cert_usage:
      - ssh-host
      - ssh-user
    comment: nxmatic@mammoth-skate
    usage:
      - user-signing
    profiles:
      - system
      - user
    principals:
      committed: committed
    authorized_keys_options:
      - forwarding
    public: AAAAC3NzaC1lZDI1NTE5AAAAIGet5e+oTAP3AfpWzlaM+SrHov14dGzao1jadf0S03oE
    # sops:encrypted
    private: ENC[AES256_GCM,data:,iv:fra0ED1eYCrl44tW0loMlJQQvxNu3hypeCyiSBDRaQ8=,tag:KD/yhwwqfFRw8SXEekt+Rw==,type:str]
    annotations:
      public_scope: user
  vz-guest-nixos:
    type: ssh-ed25519
    authority: mammoth-skate
    # v1: authorities.mammoth-skate.usage = [ssh-host, ssh-user]
    cert_usage:
      - ssh-host
      - ssh-user
    comment: root@bioskop-nixos
    usage:
      - agent-signing
      - user-signing
    profiles:
      - system
    principals:
      linux-builder: linux-builder
      committed: committed
    public: AAAAC3NzaC1lZDI1NTE5AAAAIG1fGVLU3BOE2R+1zuJRSOAxYsw+fd4y7YvwZFxMs8RF
