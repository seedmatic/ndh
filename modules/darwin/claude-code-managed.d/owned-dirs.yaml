  develop-sec:
    # 🛡️ security
    owned:
      - ~/.claude/.scratchpad.d/security/**
      - /private/tmp/claude-sec-*
    lives_there: live page, models, reviews, probes, logs (redact.sh), mutation scratch
    exclude:
