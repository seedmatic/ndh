# The engraved registry of the sessions' deletion areas (ndh; the operator's decision of 2026-10-17:
# the sessions propose, with their argument; security validates and engraves here; the deny-hook reads only this).
# The hook gets the JSON generated from this file at build.

# Rule: a session may remove ONE EXACT path inside one of ITS `owned` patterns (or `git worktree remove` one of its
# `worktrees`), outside every exclude: global_exclude, pages_never_remove, and its own `exclude`. Never an area's root,
# no glob or variable in the target, no `cd /` first; the real path (symlinks resolved) must satisfy the same.
# Patterns: `*` = one path segment, `/**` = anything below, `{a,b}` and `{1..8}` expand to exact names at build.
pages_never_remove:
  - ~/.claude/.scratchpad.d/*/LIVE.md # every topic's live page: its header restores the session's title
global_exclude:
  - "~" # the home itself
  - ~/.claude # the Claude config root (scratchpad topics below are per session)
  - ~/.local/share/password-store/** # the operator's pass store
  - ~/.ssh/** # ssh keys and config
  - ~/.config/sops/** # the age identities
  - /Volumes/git-bare-store/** # every bare: the repositories themselves
  - /Volumes/git-worktree-store/seedmatic/rke2lab.d/memory/** # the shared memory worktree
  - /Volumes/git-worktree-store/nxmatic/keyhole.d/** # the operator's keyring tooling and its encrypted backups
  - /Volumes/git-worktree-store/nxmatic/claude-home.d/** # the private claude-home heads (registry, memory, pass replica)
  - /Volumes/git-worktree-store/*/*.d/develop # every develop checkout (the trunk)
  - /Volumes/git-worktree-store/*/*.d/develop/**
  - /Volumes/git-worktree-store/*/*.d/main # every main checkout (the reference)
  - /Volumes/git-worktree-store/*/*.d/main/**
  - /Volumes/git-worktree-store/seedmatic/rke2lab.d/operator/develop # the ONE Pulumi stack home
  - /Volumes/git-worktree-store/seedmatic/rke2lab.d/operator/develop/.pulumi-state # its state: never
  - /Volumes/git-worktree-store/seedmatic/rke2lab.d/operator/develop/.pulumi-state/**
  - ~/.tart/** # Tart VMs: removing a VM is the operator's gesture
  - /private/var/lib/git/** # the old store, under the operator's own triage
  - /nix/** # the nix store
  - '**/.secrets' # any .secrets, anywhere, and what it holds
  - '**/.secrets/**'
