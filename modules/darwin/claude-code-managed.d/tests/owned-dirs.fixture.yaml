# A registry in the shape security engraves, so the check exercises the YAML → JSON step and its validation
# even before the real registry lands.
pages_never_remove:
  - "~/.claude/.scratchpad.d/*/LIVE.md"
global_exclude:
  - "~"
  - "**/.secrets"
sessions:
  fixture-a:
    owned:
      - "~/.claude/.scratchpad.d/fixture-a/**"
      - "/private/tmp/fixa-{1..3}"
    worktrees:
      - "/Volumes/git-worktree-store/seedmatic/ndh.d/fixture/*"
    exclude:
      - "~/.claude/.scratchpad.d/fixture-a/keep.md"
    conversations:
      - "00000000-0000-0000-0000-00000000000a"
    workspace: /Volumes/git-worktree-store/seedmatic/rke2lab.d/develop.code-workspace
