# The signers an operator seat's activation may run with the TLS authority, and the first ndh commit after which
# their --check (and every run that signs nothing) never decrypts keys.yaml. fleet-switch runs a signer's --check
# only on a target revision that contains that commit.
- name: incus-cluster-cert-renew
  option: incusClusterCert
  noDecryptFix: 7a71fcfa15cac6fd7c6de9bfc5a2f3b0f5f03ee9
- name: attic-leaf-sign
  option: atticLeaf
  noDecryptFix: cf0a0731c495a612fc8bae6e5ae82f698d3b30ba
