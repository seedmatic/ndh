# Headscale tunnel via bioskop for off-LAN access
# Forwards headscale control plane port (41841) through SSH tunnel

Host *.bboxmatic
  HostName bboxmatic.duckdns.org
  Port 2222
  User nxmatic
  ExitOnForwardFailure yes
  ServerAliveInterval 30
  ServerAliveCountMax 3

Host headscale.bboxmatic
  LocalForward 127.0.0.1:41841 127.0.0.1:41841
  LocalForward 127.0.0.1:5353 127.0.0.1:53

Host rdp.bboxmatic
  LocalForward 0.0.0.0:5901 localhost:5900
