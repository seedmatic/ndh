# v2 shape of the NDH SSH keys bundle.
#
# Changes from v1:
#   - Top-level `authorities:` holds CA material once. Each authority's
#     private (CA signing key) is encrypted exactly once by sops.
#   - Each `keys.<name>` entry references its authority by name via
#     `authority: <name>` instead of inlining an `authorities.<name>` block.
#   - Each key declares `profiles: [...]` — the orthogonal role set from
#     which the split step derives per-profile subsets (bringup/host/user).
#   - The top-level `mammoth-skate` key entry from v1 is removed; its CA
#     material now lives at `authorities.mammoth-skate` and its
#     user-signing usage is subsumed by per-key references.
#
# Validation: modules/home-manager/ssh.d/keys.schema.yaml (JSON Schema).
# Enrichment: ssh-enrich-keys-yaml.sh resolves `authority:` refs against
# top-level `authorities.<name>` when signing per-key cert pairs.
authorities:
  mammoth-skate:
    type: ssh-ed25519
    comment: cert-authority@mammoth-skate
    domain: mammoth-skate.ts.net
    public: AAAAC3NzaC1lZDI1NTE5AAAAIMm2fu/uVbaaj1OljiSnZ9T1ES9yvbG+Y6JhyLrnQQAS
    # sops:encrypted
    private: ENC[AES256_GCM,data:,iv:fpTcOKLw+4GHWckddTC0chZhk+3Wkiw6xqhJo6tB5uA=,tag:CfwtF6oBQlqf9wx+nFQlfw==,type:str]
    usage:
      - ssh-authority
    annotations:
      public_scope: system

keys:

  nix-store:
    type: ssh-ed25519
    authority: mammoth-skate
    comment: nix-store@mammoth-skate
    usage:
      - ssh-host
      - user-signing
    profiles:
      - bringup
      - host
    principals:
      nix-store: nix-store
    annotations:
      public_scope: system

  linux-builder:
    type: ssh-ed25519
    authority: mammoth-skate
    comment: linux-builder@mammoth-skate
    usage:
      - ssh-host
      - agent-signing
      - user-signing
    profiles:
      - host
    principals:
      linux-builder: linux-builder
      committed: committed
    public: AAAAC3NzaC1lZDI1NTE5AAAAIMHU43EVt2ETrAd7u65ZX+nyLtbMKVr+zvdyM/6db7MV
    # sops:encrypted
    private: ENC[AES256_GCM,data:,iv:9I0AktC29q1G+qMx3NVYVW+tSddP+xsgspuW8oykkek=,tag:iu8NC/AcAGdr5OYaZ3jb3g==,type:str]
    annotations:
      public_scope: user

  rdp-host:
    type: ssh-ed25519
    authority: mammoth-skate
    comment: nxmatic@mammoth-skate
    usage:
      - user-signing
    profiles:
      - host
      - user
    principals:
      committed: committed
    public: AAAAC3NzaC1lZDI1NTE5AAAAIGet5e+oTAP3AfpWzlaM+SrHov14dGzao1jadf0S03oE
    # sops:encrypted
    private: ENC[AES256_GCM,data:,iv:igEriDRTkGemT96b9UiKR+KdhJ3RkHrShO2TZ1nLPnk=,tag:q2jmyvpx6kH6w9sIvMTxEw==,type:str]
    authorized_keys_options:
      - forwarding
    annotations:
      public_scope: user

  rke2-cluster:
    type: ssh-ed25519
    authority: mammoth-skate
    comment: rke2-cluster@github
    usage:
      - ssh-user
    profiles:
      - user
    public: AAAAC3NzaC1lZDI1NTE5AAAAIEk3mPT46ePtbxdZg4CLBGVW4Tt5iFTxNdLm1ohNpV0b
    # sops:encrypted
    private: ENC[AES256_GCM,data:,iv:n9YChkY9gefUNuYvZHprAl2LKzrim4NQgGWdSCC4mEI=,tag:n7cauIVc9hfp00q90qgTuA==,type:str]
