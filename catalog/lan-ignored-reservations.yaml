# Bbox static reservations the catalog intentionally does NOT manage.
#
# Consumed by `bbox-reconcile` to filter the EXTRA bucket.  Anything
# listed here lives on the bbox without a corresponding entry in
# `catalog.netplan.lan.hosts` — a reservation an operator made by hand
# that doesn't participate in the fleet's nix-managed plumbing.
#
# Add an entry when bbox-reconcile shouts about a reservation that's
# expected; remove when the device is retired and the bbox
# reservation is deleted.
#
# The home A/V devices (vertdegris/huematic/zecoute/pop-screen/pop-cast)
# that used to live here are now first-class `kind = "media"` entries in
# `catalog.netplan.lan.hosts` — ndh reconciles them, so they are no longer
# "unmanaged" and must NOT be listed here.
#
# Schema: a list of {mac, hostname, note}.  `mac` is the comparison
# key (case-insensitive); `hostname` and `note` are human-readable
# annotations only.
ignored_reservations: []
