# Fleet signing private keys, SOPS-encrypted.
#
# Each entry mirrors a publicKey declaration in catalog/cache-trust.nix
# under caches.cachix.<name>. The value here is the BARE base64 bytes
# of the nix private key — the `<name>:` prefix that nix-daemon expects
# on disk is reconstructed at activation time by
# modules/.common.d/cache-trust.nix.
#
# External caches (nixos, nxmatic, flakehub, flox, aseippFastly, etc.)
# have no entry here because their private keys are not ours.
#
# Rotating:
#   1. nix-store --generate-binary-cache-key <name> /tmp/key /tmp/pub
#   2. Strip the `<name>:` prefix from each file's contents.
#   3. Update caches.cachix.<name>.private below with the bare private.
#   4. Update caches.cachix.<name>.publicKey in catalog/cache-trust.nix
#      with the full `<name>:<pub-base64>` wire-format value.
#   5. sops -e -i catalog/cache-trust.yaml
#   6. Re-sign existing store closures with the new key and roll deploy.
