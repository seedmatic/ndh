# Cache signing keypair.
#
# The nix-darwin-home fleet uses a single shared cachix signing key.
# The private field is SOPS-encrypted via an inline marker; the public
# field is plaintext (no secrecy requirement) and kept alongside the
# private so a reader of this file sees the pair together.
#
# The public counterpart is also kept in catalog/cache-trust.nix for
# eval-time access (trusted-public-keys wiring). An assertion at
# modules/.common.d/cache-trust.nix guards against drift between the two
# sources by comparing the yaml's public with the one in the nix file.
#
# Rotating the key:
#   1. nix-store --generate-binary-cache-key <name> key pub
#   2. Update caches.cachix.private + caches.cachix.public below.
#   3. Update caches.cachix.publicKey in catalog/cache-trust.nix.
#   4. sops -e -i catalog/cache-trust.yaml
#   5. Re-sign the existing store closures with the new key and roll
#      deploy: each host picks up the new private via sops-install-secrets
#      at activation.
