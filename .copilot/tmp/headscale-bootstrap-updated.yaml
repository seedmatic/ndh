apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-bootstrap
  namespace: headscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-bootstrap
  namespace: headscale
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-bootstrap
  namespace: headscale
subjects:
- kind: ServiceAccount
  name: headscale-bootstrap
  namespace: headscale
roleRef:
  kind: Role
  name: headscale-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: headscale-bootstrap
  namespace: headscale
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: headscale-bootstrap
      restartPolicy: OnFailure
      containers:
      - name: bootstrap
        image: alpine:3.19
        command:
        - sh
        - -c
        - |
          set -e
          
          # Install dependencies
          apk add --no-cache curl kubectl
          
          # Download headscale CLI
          HEADSCALE_VERSION="${HEADSCALE_VERSION:-0.27.0}"
          ARCH=$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/')
          curl -fsSL "https://github.com/juanfont/headscale/releases/download/v$HEADSCALE_VERSION/headscale_${HEADSCALE_VERSION}_linux_$ARCH" \
            -o /usr/local/bin/headscale
          chmod +x /usr/local/bin/headscale
          
          echo "Waiting for Headscale server to be ready..."
          until curl -sf http://headscale:8080/health; do
            echo "Headscale not ready, retrying in 5s..."
            sleep 5
          done
          
          echo "Creating admin user..."
          headscale users create admin || echo "User admin already exists"
          
          echo "Getting admin user ID..."
          USER_ID=$(headscale users list -o json | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          echo "Admin user ID: $USER_ID"
          
          echo "Creating reusable preauth key..."
          PREAUTH_KEY=$(headscale preauthkeys create --user "$USER_ID" --reusable --expiration 720h -o json | \
            grep -o '"key":"[^"]*"' | cut -d'"' -f4)
          
          if [ -z "$PREAUTH_KEY" ]; then
            echo "ERROR: Failed to extract preauth key"
            exit 1
          fi
          
          echo "Preauth key created: ${PREAUTH_KEY:0:16}..."
          echo -n "$PREAUTH_KEY" > /tmp/preauth-key.txt
          
          echo "Storing preauth key in Secret..."
          kubectl create secret generic headscale-client-auth \
            --from-file=authkey=/tmp/preauth-key.txt \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "Bootstrap complete!"
        env:
        - name: HEADSCALE_CLI_ADDRESS
          value: "headscale:8080"
        - name: HEADSCALE_VERSION
          value: "0.27.0"
